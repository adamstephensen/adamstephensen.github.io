<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-shell">
      <div>
        <p class="footer-brand">
          {%- if site.author -%}
            {{ site.author | escape }}
          {%- else -%}
            {{ site.title | escape }}
          {%- endif -%}
        </p>
        <p>{{- site.description | escape -}}</p>
      </div>

      <div>
        {%- include social-media.html -%}
      </div>
    </div>

  </div>

</footer>
